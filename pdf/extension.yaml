name: pdf
version: 2.0.0
summary: PDFs read, made from HTML or Markdown, merged, split, rotated, rendered and protected with pdftool (PDFium, qpdf, ironpress)
install:
  - sh fetch.sh
bin: [bin/pdftool, bin/qpdf]
# Reading never changes a file; every other command writes a new one and keeps asking.
rules: ["pdftool info *", "pdftool text *"]
skills: [skills/pdf]
requires:
  secrets: []
  network: false
instructions: |
  For PDF files use `pdftool`, already installed (info, text, merge, split, pages, rotate,
  to-png, compress, encrypt, decrypt, metadata, and from-html / from-md to make a PDF);
  for anything else, `qpdf`. There is no Python for PDFs any more (pdf-python is gone in
  2.0.0). Load the `pdf` skill first.
