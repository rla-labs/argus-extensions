name: web-spike

# Argus 0.8.2 spike: build Obscura from source (pinned tag), then compare it with
# Lightpanda and Chromium on real pages. Results are pushed to the web-spike-results
# branch as text. Temporary: removed once the spike's report is written.
on:
  push:
    paths: ['web-spike/**', '.github/workflows/web-spike.yml']
  workflow_dispatch:

env:
  OBSCURA_TAG: v0.2.5

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The Argus image's base: the binary must run on its glibc (2.36).
    container: rust:1-bookworm
    timeout-minutes: 180
    steps:
      - name: source
        run: |
          apt-get update -qq && apt-get install -y -qq curl ca-certificates perl make binutils file >/dev/null
          curl -fsSL -o obscura.tar.gz "https://codeload.github.com/h4ckf0r0day/obscura/tar.gz/refs/tags/${OBSCURA_TAG}"
          sha256sum obscura.tar.gz | tee build-${{ matrix.arch }}.txt
          mkdir src && tar -xzf obscura.tar.gz -C src --strip-components=1
          echo "crates: $(grep -c '^name = ' src/Cargo.lock)" >> build-${{ matrix.arch }}.txt
          grep -A1 '^name = "v8"' src/Cargo.lock >> build-${{ matrix.arch }}.txt
          find src -name build.rs >> build-${{ matrix.arch }}.txt
      - name: build (render, no stealth)
        working-directory: src
        run: |
          rustc --version >> ../build-${{ matrix.arch }}.txt
          start=$(date +%s)
          cargo build --profile release-dist -p obscura-cli --bins --features render 2>&1 | tail -5
          echo "build seconds: $(( $(date +%s) - start ))" >> ../build-${{ matrix.arch }}.txt
      - name: describe
        run: |
          mkdir -p out && cp src/target/release-dist/obscura src/target/release-dist/obscura-worker out/
          {
            ls -la out
            file out/obscura
            echo "glibc needed: $(objdump -T out/obscura | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
            echo "dynamic libraries:"; ldd out/obscura
            out/obscura --version || true
            out/obscura --help | head -40
          } >> build-${{ matrix.arch }}.txt 2>&1
          sha256sum out/* >> build-${{ matrix.arch }}.txt
          cat build-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: obscura-${{ matrix.arch }}
          path: |
            out
            build-${{ matrix.arch }}.txt

  compare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: obscura-x86_64
          path: art
      - name: engines
        run: |
          sudo install -d -m 755 /opt/spike && sudo cp art/out/* /opt/spike/ && sudo chmod 755 /opt/spike/*
          curl -fsSL -o lightpanda https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux && chmod +x lightpanda
          npx -y @puppeteer/browsers install chrome-headless-shell@stable --path "$PWD/chrome" > chrome.txt
          echo "CHROME=$(find "$PWD/chrome" -type f -name chrome-headless-shell | head -1)" >> "$GITHUB_ENV"
          sudo apt-get install -y -qq time >/dev/null
          mkdir -p results && cp art/build-*.txt results/
      - name: pages
        # Set to 1 to compare the engines on every page again (round 1 has the table).
        if: env.PAGES == '1'
        env:
          PAGES: '0'
        run: python3 web-spike/run.py /opt/spike/obscura ./lightpanda "$CHROME" results
      - name: MCP form, and the proxy
        run: |
          sudo useradd -m spike
          sudo iptables -A OUTPUT -m owner --uid-owner spike ! -o lo -j REJECT
          RUN_AS="sudo -u spike" python3 web-spike/mcp_check.py /opt/spike/obscura results || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-compare
          path: results

  confined:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: obscura-x86_64
          path: art
      - name: Obscura as an extension, in the real Argus image, confined
        run: |
          mkdir -p results
          { echo "kernel: $(uname -r)"; echo "landlock: $(cat /sys/kernel/security/lsm 2>/dev/null)"; } > results/confined.txt
          # The extension, with the binaries this run built, as its own repository.
          cp -r web-spike/ext /tmp/extsrc && mkdir -p /tmp/extsrc/web/bin && cp art/out/* /tmp/extsrc/web/bin/
          git -C /tmp/extsrc init -q && git -C /tmp/extsrc add -A && git -C /tmp/extsrc -c user.name=s -c user.email=s@s commit -qm spike
          curl -fsSL -o /tmp/check.mjs https://raw.githubusercontent.com/rla-labs/argus/v0.8.1/scripts/extension-check.mjs
          docker pull -q ghcr.io/rla-labs/argus:0.8.1
          docker volume create spike
          docker run --rm -u 0 -v spike:/data --entrypoint chown ghcr.io/rla-labs/argus:0.8.1 10001:10001 /data
          docker run --rm -i -v spike:/data -v /tmp/extsrc:/src:ro \
            --read-only --tmpfs /tmp:size=256m,mode=1777,exec \
            --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 512 \
            --workdir /app/packages/argus-agent -v /tmp/check.mjs:/check.mjs:ro \
            --entrypoint node ghcr.io/rla-labs/argus:0.8.1 /check.mjs /app /data /src 2>&1 | tee -a results/confined.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-confined
          path: results

  publish:
    needs: [compare, confined]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-spike-results
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: run-${{ github.run_number }}
      - name: commit
        run: |
          git config user.name "web-spike" && git config user.email "web-spike@users.noreply.github.com"
          git add -f "run-${{ github.run_number }}" && git commit -qm "web spike results, run ${{ github.run_number }}"
          git push origin HEAD:web-spike-results
