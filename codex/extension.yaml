name: codex
version: 1.0.0
summary: The project's agent hands a coding task to OpenAI's Codex, on Argus's OpenAI API key, with Argus approving every step and counting every request
install:
  - sh fetch.sh
mcp:
  codex:
    command: node
    args: ["${EXTENSION_DIR}/server/index.mjs"]
    # The call itself asks, showing the task; then every command Codex runs is decided by
    # the project's own policy, as if the project's agent ran it.
    access: ask
    timeout_s: 7200
    host: [approvals, steps]
    network: proxy
    route: openai
skills: [skills/codex]
requires:
  secrets: []
  network: true
instructions: |
  For code work in this project's folder that takes many steps, you can hand the task to
  OpenAI's Codex with the `run` tool of the codex server. Load the `codex` skill first.
